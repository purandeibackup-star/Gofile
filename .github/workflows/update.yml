name: Generate GoFile M3U Playlist

on:
  push:
    paths:
      - 'links.txt'
  workflow_dispatch: # Allows you to run it manually from the Actions tab

permissions:
  contents: write

jobs:
  build-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run M3U Generator
        run: python generate_m3u.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          # Only commit if the playlist actually changed
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update GoFile playlist"
          git push
